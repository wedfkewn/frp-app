name: LocalBridge
options:
  bundleIdPrefix: com.localbridge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    branch: main
  NIO:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  NIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: 0.3.4
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  LocalBridge:
    type: application
    platform: iOS
    sources:
      - path: LocalBridgeApp
    dependencies:
      - package: Citadel
      - package: NIO
      - package: NIOSSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localbridge.ios
        PRODUCT_NAME: LocalBridge
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: LocalBridgeApp/Info.plist
      properties:
        CFBundleDisplayName: LocalBridge
        NSLocalNetworkUsageDescription: "连接用户配置的 SSH 服务器与内网服务。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
    entitlements:
      path: LocalBridgeApp/LocalBridge.entitlements
      properties:
        com.apple.developer.networking.vpn.api:
          - allow-vpn
schemes:
  LocalBridge:
    build:
      targets:
        LocalBridge: all
    run:
      config: Debug
    archive:
      config: Release
